[project]
name = "unbound-behavior-tests"
version = "0.1.0"
description = "Executable behaviour cases for Unbound config parsing"
requires-python = ">=3.12"
dependencies = ["pytest>=9,<10", "pyyaml>=6,<7", "dnspython>=2,<3"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test_behavior.py"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[dependency-groups]
dev = ["ruff>=0.16,<1"]

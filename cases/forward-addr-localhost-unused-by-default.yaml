id: forward-addr-localhost-unused-by-default
title:
  en: "With do-not-query-localhost at its default (yes), a 127.0.0.1 forward-addr receives nothing"
  ja: do-not-query-localhost が既定（yes）のままだと、127.0.0.1 の forward-addr には何も届かない
chapter: "6.4"
category: A
versions: ["1.26.0"]
source:
  en: "iterator/iter_donotq.c donotq_apply_cfg() adds 127.0.0.0/8 and ::1 when do-not-query-localhost is yes, and iterator/iter_utils.c iter_filter_unsuitable() drops such targets for forward zones too"
  ja: "iterator/iter_donotq.c donotq_apply_cfg() は do-not-query-localhost が yes なら 127.0.0.0/8 と ::1 を加え、iterator/iter_utils.c iter_filter_unsuitable() は forward zone の宛先でもそれを外す"
manual:
  en: "doc/unbound.conf.5.in, do-not-query-localhost: If yes, localhost is added to the do-not-query-address entries, both IPv6 ::1 and IPv4 127.0.0.1/8. If no, then localhost can be used to send queries to."
  ja: "doc/unbound.conf.5.in do-not-query-localhost の項: If yes, localhost is added to the do-not-query-address entries, both IPv6 ::1 and IPv4 127.0.0.1/8. If no, then localhost can be used to send queries to."
layers:
  en: ["unsuitable target filtering"]
  ja: ["使えない宛先の除外"]
status: verified
config: |
  do-not-query-localhost: yes
  forward-zone:
    name: "."
    forward-addr: 127.0.0.1@5628
command: run-with-upstreams
expect:
  checkconf_exit: 0
  upstreams:
    - addr: "127.0.0.1:5628"
      replies:
        - answer: ["www.example.com. 300 IN A 192.0.2.16"]
      received_none: true
  query: "www.example.com. A"
  note:
    en: "The harness boilerplate sets do-not-query-localhost: no so that fake upstreams on loopback can be reached; this case sets it back to the default. Every case that forwards to 127.0.0.1 relies on that boilerplate line. checkconf-warns-forward-addr-localhost is the checkconf side"
    ja: "ハーネスの定型部はループバックの偽の上流に届くよう do-not-query-localhost: no にしている。このケースは既定値に戻す。127.0.0.1 へ転送するケースはすべて定型部のこの行に頼っている。checkconf 側は checkconf-warns-forward-addr-localhost"

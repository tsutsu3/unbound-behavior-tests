expect:
  checkconf_exit: 0
  listen:
    proto: udp
    addr: "0.0.0.0:5401"
  query: "example.com. A"
  note:
    en: "32 entries are not rejected. Listening on 0.0.0.0 catches the query whichever address in 127.0.0.0/8 it goes to"
    ja: "32 件でも拒否されない。0.0.0.0 で待ち受けて 127.0.0.0/8 のどれに出ても捕まえる"

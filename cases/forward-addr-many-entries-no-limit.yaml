id: forward-addr-many-entries-no-limit
title:
  en: "There is no limit on the number of forward-addr entries"
  ja: forward-addr の件数に上限はない
chapter: "6.4"
category: A
versions: ["1.26.0"]
source:
  en: "iterator/iter_fwd.c read_fwds_addr() just walks cfg->forwards->addrs without counting. iterator/iter_delegpt.c delegpt_add_addr_mlc() has no limit on the count either"
  ja: "iterator/iter_fwd.c read_fwds_addr() は cfg->forwards->addrs を単に走査するだけで件数を数えない。iterator/iter_delegpt.c delegpt_add_addr_mlc() にも件数の上限がない"
manual:
  en: "none (the forward-addr entry says nothing about the number of entries)"
  ja: "none（forward-addr の項に件数の記述がない）"
layers:
  en: ["forwarder list construction"]
  ja: ["転送先リストの構築"]
status: verified
config: |
  forward-zone:
    name: "."
    forward-addr: 127.0.0.1@5401
    forward-addr: 127.0.0.2@5401
    forward-addr: 127.0.0.3@5401

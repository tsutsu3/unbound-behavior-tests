id: forward-zone-duplicate-last-wins
title:
  en: "With two forward-zone clauses for the same name, the one written last wins"
  ja: 同名の forward-zone を 2 つ書くと、設定ファイルで後に書いた方が勝つ
chapter: "6.5"
category: A
versions: ["1.26.0"]
source:
  en: 'util/configparser.y forwardstart inserts each forward-zone clause at the head of cfg->forwards, so iterator/iter_fwd.c read_forwards() walks them in reverse order. forwards_insert_data() logs duplicate forward zone %s ignored. when rbtree_insert() fails and frees the new one, so the clause processed first, which is the one written last, remains'
  ja: 'util/configparser.y forwardstart が forward-zone 節を cfg->forwards の先頭に挿入するので、iterator/iter_fwd.c read_forwards() は記述と逆順に処理する。forwards_insert_data() は rbtree_insert() が失敗すると duplicate forward zone %s ignored. を出して新しい方を捨てるので、先に処理された = 最後に書いた節が残る'
manual:
  en: "none (the forward-zone section says clauses may be repeated for different names, but not what happens when a name is repeated)"
  ja: "none（forward-zone 節の説明に、同じ name を 2 回書いたときの扱いの記述がない）"
layers:
  en: ["config list build order (head insertion)", "duplicate handling at forward zone registration"]
  ja: ["設定リストの構築順（先頭挿入）", "転送ゾーン登録時の重複処理"]
status: verified
config: |
  forward-zone:
    name: "."
    forward-addr: 127.0.0.1@5410
  forward-zone:
    name: "."
    forward-addr: 127.0.0.1@5411
command: run-and-observe
expect:
  checkconf_exit: 0
  listen:
    proto: udp
    addr: "127.0.0.1:5411"
  query: "example.com. A"
  note:
    en: "The addresses are not merged: the first clause is dropped whole. The log says ignored, but it is the clause written earlier that is ignored. The same double reversal as local-zone-duplicate-last-line-wins"
    ja: "アドレスが合算されるのではなく、先に書いた節が丸ごと捨てられる。ログの ignored が指すのは先に書いた方。local-zone-duplicate-last-line-wins と同じ二重の反転"

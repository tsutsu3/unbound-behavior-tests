id: cache-min-ttl-raises-upstream-ttl
title:
  en: "cache-min-ttl raises the TTL of an upstream answer, and the client already sees the raised TTL on the first reply"
  ja: cache-min-ttl は上流の答えの TTL を引き上げ、1回目の応答からクライアントに引き上げた TTL が見える
chapter: "4.3"
category: A
versions: ["1.26.0"]
source:
  en: "util/data/msgreply.c rdata_copy() raises ttl to MIN_TTL (cache-min-ttl, set in util/config_file.c config_apply()) while parsing the upstream reply, before it is cached or sent. The harness has no authoritative server, so Unbound is made its own: queries it sends from outgoing-interface 127.0.0.2 come back to its own port, where access-control-view gives that source a view whose static local zone answers as the authority. The client (127.0.0.1) has no view, so its query misses the local zones and goes through the iterator to the stub-addr, and the reply is parsed like any upstream reply"
  ja: "util/data/msgreply.c rdata_copy() が上流の応答をパースするとき、キャッシュや送信より前に ttl を MIN_TTL（cache-min-ttl。util/config_file.c config_apply() で設定）まで引き上げる。ハーネスに権威 DNS サーバーがないので、Unbound 自身を権威役にする。outgoing-interface 127.0.0.2 から出した問い合わせは自分のポートに戻り、access-control-view がその送信元に view を与え、view の static ゾーンが権威として答える。問い合わせ元 127.0.0.1 には view がないので、local zone に当たらず iterator から stub-addr へ出て、応答は上流の応答と同じくパースされる"
manual:
  en: "none (cache-min-ttl: Time to live minimum for RRsets and messages in the cache. It does not say that clients see the raised TTL; that is said only for cache-max-ttl)"
  ja: "none（cache-min-ttl の項は Time to live minimum for RRsets and messages in the cache. とだけ書き、クライアントに引き上げた TTL が見えることは書いていない。下流に見えることを書いているのは cache-max-ttl の項だけ）"
layers:
  en: ["TTL clamping on reply parse"]
  ja: ["応答パース時の TTL の丸め"]
status: verified
config: |
  cache-min-ttl: 600
  outgoing-interface: 127.0.0.2
  access-control: 127.0.0.2/32 allow
  access-control-view: 127.0.0.2/32 authview
  view:
    name: "authview"
    local-zone: "example." static
    local-data: "example. 86400 IN SOA ns.example. host.example. 1 7200 900 604800 86400"
    local-data: "www.example. 300 IN A 192.0.2.1"
  stub-zone:
    name: "example."
    stub-addr: 127.0.0.1@15353
command: run-and-dig
expect:
  checkconf_exit: 0
  query: "www.example. A"
  rcode: "NOERROR"
  answer_contains: ["192.0.2.1"]
  answer_ttl: 600
  note:
    en: "The authority side (the view's local-data) gives TTL 300. See upstream-ttl-kept-without-cache-min-ttl for the same setup without cache-min-ttl"
    ja: "権威役（view の local-data）が付けた TTL は 300。cache-min-ttl を外した同じ構成は upstream-ttl-kept-without-cache-min-ttl"

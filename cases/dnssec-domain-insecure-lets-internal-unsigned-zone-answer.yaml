id: dnssec-domain-insecure-lets-internal-unsigned-zone-answer
title:
  en: "With domain-insecure for the internal zone, the public DS is ignored and the unsigned answer is returned without the AD bit"
  ja: "内部ゾーンを domain-insecure に書くと、公開側の DS は無視され、署名のない答えが AD ビットなしで返る"
chapter: "8.5"
category: documented
versions:
- "1.26.0"
source:
  en: "validator/val_anchor.c anchors_apply_cfg() enters a domain-insecure name as a trust anchor without keys (anchor_insert_insecure()); validator/validator.c processInit() finds that anchor first and marks the answer insecure without asking for the DS"
  ja: "validator/val_anchor.c anchors_apply_cfg() は domain-insecure の名前を鍵のない信頼アンカーとして入れる（anchor_insert_insecure()）。validator/validator.c processInit() はこのアンカーを先に見つけ、DS を問い合わせずに答えを insecure にする"
manual:
  en: "doc/unbound.conf.rst domain-insecure: Sets <domain name> to be insecure, DNSSEC chain of trust is ignored towards the <domain name>. So a trust anchor above the domain name can not make the domain secure with a DS record, such a DS record is then ignored. ... A DS record externally can create validation failures for that internal domain."
  ja: "doc/unbound.conf.rst domain-insecure の項: Sets <domain name> to be insecure, DNSSEC chain of trust is ignored towards the <domain name>. So a trust anchor above the domain name can not make the domain secure with a DS record, such a DS record is then ignored. ... A DS record externally can create validation failures for that internal domain."
layers:
  en:
  - "forward decision"
  - "chain of trust (DS lookup at the parent)"
  - "validation"
  ja:
  - "転送の判定"
  - "信頼の連鎖（親への DS の問い合わせ）"
  - "検証"
status: verified
config: |
  trust-anchor: "example. DS 61329 13 2 1bc504f7c451088bacfb6beecb82e3ecd4e736abf54b5a992ce62412ee796303"
  domain-insecure: "corp.example."
  stub-zone:
    name: "example."
    stub-addr: 127.0.0.1@5817
  forward-zone:
    name: "corp.example."
    forward-addr: 127.0.0.1@5818
command: run-with-upstreams
expect:
  checkconf_exit: 0
  upstreams:
  - addr: "127.0.0.1:5817"
    replies:
    - qname: "example."
      qtype: DNSKEY
      aa: true
      answer:
      - "example. 300 IN DNSKEY 257 3 13 J7LPdwb2le8NazjJx4GhDyVr6b1hPbMi +xG6zzfROqM4k3r82dbZ+1/WSnEUmz/a NWXGdRh32ZkiBjRFPKB12A=="
      - "example. 300 IN RRSIG DNSKEY 13 1 300 20460901000000 20260901000000 61329 example. Y0CL52dE69y69BISNO+9OgzTU51C5ZS5 b1svuiczxUL6S/1lPJFgMj5r/jWYy5+Z aXzSBIguRkLFQ2drcvBq4A=="
    - qname: "corp.example."
      qtype: DS
      aa: true
      answer:
      - "corp.example. 300 IN DS 32308 13 2 ab15475c210915a18634fcc32f9815ac066abadf7c70b94dd4254775c6c0c74f"
      - "corp.example. 300 IN RRSIG DS 13 2 300 20460901000000 20260901000000 61329 example. UREXmnJtSXQlet+4+LHUx4O/DwRD7NAs FggSLJTLv4PJJ6N471Of7/TXV6JtSjmT Ivm+ayUNg83p3AX0zSKhuw=="
    received_none: true
  - addr: "127.0.0.1:5818"
    replies:
    - qname: "www.corp.example."
      qtype: A
      answer:
      - "www.corp.example. 300 IN A 192.0.2.90"
    - {}
    received_contains:
    - "www.corp.example. A"
  query: "www.corp.example. A"
  query_flags:
  - do
  rcode: "NOERROR"
  answer_contains:
  - "www.corp.example. 300 IN A 192.0.2.90"
  flags_not_contains:
  - ad
  note:
    en: "Category documented: the result matches the manual. Nothing is asked of the public parent at all"
    ja: "分類 documented: man の記述どおり。公開側の親には何も問い合わせない"

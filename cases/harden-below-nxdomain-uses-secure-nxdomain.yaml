id: harden-below-nxdomain-uses-secure-nxdomain
title:
  en: With a DNSSEC-secure NXDOMAIN for a name in the cache, a query for a name below it is answered NXDOMAIN without querying upstream
  ja: DNSSEC で secure の NXDOMAIN がキャッシュにあれば、その下の名前への問い合わせに上流へ問い合わせずに NXDOMAIN で答える
chapter: '4.3'
category: documented
versions:
- 1.26.0
source:
  en: 'services/cache/dns.c dns_cache_lookup(): with harden-below-nxdomain it looks up the parents of the name in the message cache and answers NXDOMAIN only from an entry whose security status is sec_status_secure'
  ja: 'services/cache/dns.c dns_cache_lookup(): harden-below-nxdomain が有効なら、問い合わせ名の親を message cache で探し、security status が sec_status_secure の項目からだけ NXDOMAIN で答える'
manual:
  en: 'doc/unbound.conf.rst harden-below-nxdomain: returns NXDOMAIN to queries for a name below another name that is already known to be NXDOMAIN. To try to avoid this only DNSSEC-secure NXDOMAINs are used, because the old software does not have DNSSEC.'
  ja: 'doc/unbound.conf.rst harden-below-nxdomain: returns NXDOMAIN to queries for a name below another name that is already known to be NXDOMAIN. To try to avoid this only DNSSEC-secure NXDOMAINs are used, because the old software does not have DNSSEC.'
layers:
  en:
  - message cache
  - validator
  ja:
  - message cache
  - validator
status: verified
config: |
  aggressive-nsec: no
  trust-anchor: "example. DS 61329 13 2 1bc504f7c451088bacfb6beecb82e3ecd4e736abf54b5a992ce62412ee796303"
  stub-zone:
    name: "example."
    stub-addr: 127.0.0.1@5929
command: run-sequence
expect:
  checkconf_exit: 0
  upstreams:
  - addr: 127.0.0.1:5929
    replies:
    - qname: example.
      qtype: DNSKEY
      aa: true
      answer:
      - example. 300 IN DNSKEY 257 3 13 J7LPdwb2le8NazjJx4GhDyVr6b1hPbMi +xG6zzfROqM4k3r82dbZ+1/WSnEUmz/a NWXGdRh32ZkiBjRFPKB12A==
      - example. 300 IN RRSIG DNSKEY 13 1 300 20460901000000 20260901000000 61329 example. Y0CL52dE69y69BISNO+9OgzTU51C5ZS5 b1svuiczxUL6S/1lPJFgMj5r/jWYy5+Z aXzSBIguRkLFQ2drcvBq4A==
    - rcode: NXDOMAIN
      aa: true
      authority:
      - example. 300 IN SOA ns.example. host.example. 1 3600 900 604800 300
      - example. 300 IN RRSIG SOA 13 1 300 20460901000000 20260901000000 61329 example. xuOuzbsWK42wawOBLIyv7Dz0nehdLjWH JEteTfGHGMjrljXwsb+vq8tA4uSFpSJr AjRlAR0y3gxGELYP9U012w==
      - example. 300 IN NSEC example. NS SOA RRSIG NSEC DNSKEY
      - example. 300 IN RRSIG NSEC 13 1 300 20460901000000 20260901000000 61329 example. I8+d6QWXEniGf/0vA8hygkEb9b0yyIWs 3Bx8pK2cs2CGOKHAsrU/sEpgc5J9zN40 bI3uftYSMF6poswn0woXJA==
  steps:
  - query: nx.example. A
    rcode: NXDOMAIN
    upstream_new_min: 1
  - query: a.nx.example. A
    rcode: NXDOMAIN
    upstream_new: 0
  note:
    en: 'Category documented: matches the manual. aggressive-nsec is off so that the NSEC cache cannot be what answers. The zone is signed with the test key in tools/keys and its apex NSEC says nothing exists below the apex. Compare harden-below-nxdomain-ignores-insecure-nxdomain'
    ja: '分類 documented: man の記述どおり。NSEC のキャッシュが答えることのないよう aggressive-nsec を切った。ゾーンは tools/keys のテスト用の鍵で署名し、頂点の NSEC は頂点の下に何もないことを示す。harden-below-nxdomain-ignores-insecure-nxdomain と比べる'

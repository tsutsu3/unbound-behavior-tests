id: cache-max-negative-ttl-setting-caps-soa-ttl
title:
  en: "Setting cache-max-negative-ttl to 1000 cuts the SOA TTL of an NXDOMAIN (TTL and MINIMUM 86400) to 1000"
  ja: cache-max-negative-ttl を 1000 にすると、SOA の TTL と MINIMUM が 86400 の NXDOMAIN は 1000 に切り詰められる
chapter: "4.3"
category: undecided
versions: ["1.26.0"]
source:
  en: "util/data/msgreply.c rdata_copy(): for an SOA in the AUTHORITY section, ttl = min(ttl, SOA MINIMUM), then MIN_TTL / MAX_TTL, then MAX_NEG_TTL (cache-max-negative-ttl). iterator/iterator.c logs the parsed reply at verbosity 4 (incoming scrubbed packet), so the SOA line shows the clamped TTL. The harness has no authoritative server, so Unbound is made its own: queries it sends from outgoing-interface 127.0.0.2 come back to its own port, where access-control-view gives that source a view whose static local zone answers as the authority. The client (127.0.0.1) has no view, so its query misses the local zones and goes through the iterator to the stub-addr, and the reply is parsed like any upstream reply"
  ja: "util/data/msgreply.c rdata_copy(): AUTHORITY の SOA は ttl = min(ttl, SOA の MINIMUM) の後、MIN_TTL / MAX_TTL、続けて MAX_NEG_TTL（cache-max-negative-ttl）を当てる。iterator/iterator.c は verbosity 4 でパース後の応答をログに出す（incoming scrubbed packet）ので、SOA の行に丸めた TTL が出る。ハーネスに権威 DNS サーバーがないので、Unbound 自身を権威役にする。outgoing-interface 127.0.0.2 から出した問い合わせは自分のポートに戻り、access-control-view がその送信元に view を与え、view の static ゾーンが権威として答える。問い合わせ元 127.0.0.1 には view がないので、local zone に当たらず iterator から stub-addr へ出て、応答は上流の応答と同じくパースされる"
manual:
  en: "doc/unbound.conf.rst cache-max-negative-ttl: Time to live maximum for negative responses, these have a SOA in the authority section that is limited in time. This applies to NXDOMAIN and NODATA answers. Default: 3600"
  ja: "doc/unbound.conf.rst cache-max-negative-ttl: Time to live maximum for negative responses, these have a SOA in the authority section that is limited in time. This applies to NXDOMAIN and NODATA answers. Default: 3600"
layers:
  en: ["TTL clamping on reply parse"]
  ja: ["応答パース時の TTL の丸め"]
status: verified
config: |
  verbosity: 4
  cache-max-negative-ttl: 1000
  outgoing-interface: 127.0.0.2
  access-control: 127.0.0.2/32 allow
  access-control-view: 127.0.0.2/32 authview
  view:
    name: "authview"
    local-zone: "example." static
    local-data: "example. 86400 IN SOA ns.example. host.example. 1 7200 900 604800 86400"
    local-data: "www.example. 300 IN A 192.0.2.1"
  stub-zone:
    name: "example."
    stub-addr: 127.0.0.1@15353
command: run-and-dig
expect:
  checkconf_exit: 0
  query: "nx.example. A"
  rcode: "NXDOMAIN"
  stderr_contains: "example.\t1000\tIN\tSOA"
  note:
    en: "Category undecided: matches the manual. Same setup as cache-max-negative-ttl-default-caps-soa-ttl with the setting changed. The AUTHORITY section is not in the expect keys, so the TTL is read from the verbosity 4 log"
    ja: "分類 undecided: man の記述どおり。cache-max-negative-ttl-default-caps-soa-ttl と同じ構成で設定だけを変えた。AUTHORITY は expect のキーで見られないので、TTL は verbosity 4 のログで見る"

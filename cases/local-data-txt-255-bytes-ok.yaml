id: local-data-txt-255-bytes-ok
title:
  en: "A TXT character-string of up to 255 wire bytes is accepted"
  ja: TXT の character-string はワイヤ長 255 バイトまで受理される
chapter: "5.5"
category: A
versions: ["1.26.0"]
source:
  en: "sldns/str2wire.c sldns_str2wire_str_buf(). It returns LDNS_WIREPARSE_ERR_INVALID_STR when sl >= 255, so at most 255 bytes can be written"
  ja: "sldns/str2wire.c sldns_str2wire_str_buf()。sl >= 255 で LDNS_WIREPARSE_ERR_INVALID_STR を返すため、書き込めるのは 255 バイトまで"
manual:
  en: "none (the local-data entry in `unbound.conf.5.in` gives no length limit for a character-string; searched for '255', 'character-string' and 'length')"
  ja: "none（`unbound.conf.5.in` の local-data の項に character-string の長さ上限の記述がない。'255' 'character-string' 'length' で検索）"
layers:
  en: ["RR rdata to wire conversion"]
  ja: ["RR rdata のワイヤ変換"]
status: verified
config: |
  local-zone: "example.com." static
  local-data: 'example.com. TXT "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"'
command: run-and-dig
expect:
  checkconf_exit: 0
  query: "example.com. TXT"
  rcode: "NOERROR"
  answer_count: 1
  note:
    en: "Exactly 255 bytes passes"
    ja: "255 バイトちょうどは通る"

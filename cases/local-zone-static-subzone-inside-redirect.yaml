id: local-zone-static-subzone-inside-redirect
title:
  en: "A static local-zone below a redirect zone answers its own name with its own local-data"
  ja: redirect ゾーンの下に書いた static の local-zone は、自分の local-data で答える
chapter: "5.4"
category: A
versions: ["1.26.0"]
source:
  en: "services/localzone.c lz_enter_rr_str() puts mail.example.com. into the closest zone mail.example.com., so lz_enter_rr_into_zone() does not see it as non-apex data of the redirect zone. local_zones_tags_lookup() picks mail.example.com. for the query"
  ja: "services/localzone.c lz_enter_rr_str() は mail.example.com. を最も近いゾーン mail.example.com. に入れるので、lz_enter_rr_into_zone() は redirect ゾーンの頂点以外のデータとは見なさない。問い合わせには local_zones_tags_lookup() が mail.example.com. を選ぶ"
manual:
  en: "none (the redirect entry forbids local data beneath the zone name but does not mention nested local-zone)"
  ja: "none（redirect の項は頂点より下の local data を禁じるが、入れ子の local-zone には触れていない）"
layers:
  en: ["covering zone lookup for local-data", "closest zone lookup"]
  ja: ["local-data の被覆ゾーン検索", "最も近いゾーンの検索"]
status: verified
config: |
  local-zone: "example.com." redirect
  local-data: "example.com. A 192.0.2.1"
  local-zone: "mail.example.com." static
  local-data: "mail.example.com. A 192.0.2.25"
command: run-and-dig
expect:
  checkconf_exit: 0
  query: "mail.example.com. A"
  rcode: "NOERROR"
  answer_contains: ["192.0.2.25"]
  answer_count: 1
  note:
    en: "unbound-checkconf passes, unlike writing mail.example.com. local-data in the redirect zone itself (local-zone-redirect-non-apex-data)"
    ja: "redirect ゾーンに直接 mail.example.com. の local-data を書く場合（local-zone-redirect-non-apex-data）と違い、unbound-checkconf を通る"

id: local-zone-builtin-home-arpa-gives-nxdomain
title:
  en: "With no configuration, the built-in home.arpa. zone answers NXDOMAIN for names under it"
  ja: 何も設定しなければ、組み込みの home.arpa. ゾーンがその下の名前に NXDOMAIN を返す
chapter: "5.5"
category: A
versions: ["1.26.0"]
source:
  en: "services/localzone.c default_zones_special_array has home.arpa., and add_empty_default() enters it as static with only SOA and NS. local_zones_zone_answer() answers NXDOMAIN for a name without a local_data node"
  ja: "services/localzone.c default_zones_special_array に home.arpa. があり、add_empty_default() が SOA と NS だけの static として入れる。local_zones_zone_answer() は local_data のノードがない名前に NXDOMAIN を返す"
manual:
  en: "doc/unbound.conf.5.in, default zone list: The default zones are localhost, reverse 127.0.0.1 and ::1, the home.arpa, resolver.arpa, service.arpa, onion, test, invalid and the AS112 zones. (the home.arpa entry shows local-zone: \"home.arpa.\" static with SOA and NS)"
  ja: "doc/unbound.conf.5.in 既定ゾーンの一覧: The default zones are localhost, reverse 127.0.0.1 and ::1, the home.arpa, resolver.arpa, service.arpa, onion, test, invalid and the AS112 zones.（home.arpa の項は local-zone: \"home.arpa.\" static と SOA、NS を示す）"
layers:
  en: ["built-in zone registration"]
  ja: ["組み込みゾーンの登録"]
status: verified
config: |
  # no local-zone and no local-data
command: run-and-dig
expect:
  checkconf_exit: 0
  query: "nas.home.arpa. A"
  rcode: "NXDOMAIN"
  answer_count: 0
  note:
    en: "The query does not leave Unbound"
    ja: "問い合わせは Unbound の外へ出ない"

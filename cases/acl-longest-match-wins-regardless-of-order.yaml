id: acl-longest-match-wins-regardless-of-order
title:
  en: "access-control uses the most specific netblock for the source address, whatever the order of the lines: a /32 refuse beats a /8 written before it and a /24 written after it"
  ja: access-control は行の順序によらず、問い合わせ元に最も長く一致する範囲を使う。/32 の refuse は、前に書いた /8 の allow にも後に書いた /24 の allow にも勝つ
chapter: "7.1"
category: undecided
versions: ["1.26.0"]
source:
  en: "daemon/acl_list.c acl_list_apply_cfg() inserts every netblock into an addr_tree, and acl_addr_lookup() returns the most specific entry via addr_tree_lookup(); daemon/worker.c worker_handle_request() then calls deny_refuse_all() with acl_refuse before local zones"
  ja: "daemon/acl_list.c acl_list_apply_cfg() はすべての範囲を addr_tree に入れ、acl_addr_lookup() は addr_tree_lookup() で最も長く一致するものを返す。daemon/worker.c worker_handle_request() は local zone より前に deny_refuse_all() で acl_refuse を処理する"
manual:
  en: "doc/unbound.conf.rst access-control: The most specific netblock match is used, if none match refuse is used. The order of the access-control statements therefore does not matter."
  ja: "doc/unbound.conf.rst access-control の項: The most specific netblock match is used, if none match refuse is used. The order of the access-control statements therefore does not matter."
layers:
  en: ["access control"]
  ja: ["アクセス制御"]
status: verified
config: |
  access-control: 127.0.0.1/32 refuse
  access-control: 127.0.0.0/24 allow
  local-zone: "example.com." static
  local-data: "www.example.com. A 192.0.2.1"
command: run-and-dig
expect:
  checkconf_exit: 0
  query: "www.example.com. A"
  rcode: "REFUSED"
  note:
    en: "Category undecided: the result matches the manual. The harness boilerplate already has access-control: 127.0.0.0/8 allow before the case lines, and the query comes from 127.0.0.1. refuse also stops local-data from answering"
    ja: "分類 undecided: man の記述どおり。ハーネスの定型部はケースの行より前に access-control: 127.0.0.0/8 allow を持ち、問い合わせ元は 127.0.0.1。refuse では local-data も答えない"

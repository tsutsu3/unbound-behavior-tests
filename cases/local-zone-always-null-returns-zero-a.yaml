id: local-zone-always-null-returns-zero-a
title:
  en: "always_null answers an A query for a name without local-data with 0.0.0.0 and TTL 3600"
  ja: "always_null は、local-data のない名前の A の問い合わせに 0.0.0.0 を TTL 3600 で返す"
chapter: "5.3"
category: documented
versions: ["1.26.0"]
source:
  en: "services/localzone.c local_zones_zone_answer(): in the local_zone_always_null branch, a qtype A query is answered with 0.0.0.0 and a qtype AAAA query with ::, both built with rr_ttl = 3600; any other qtype falls through to the NOERROR/NODATA reply. The branch is reached only when local_data_answer() found no matching local-data"
  ja: "services/localzone.c local_zones_zone_answer(): local_zone_always_null の分岐で、qtype が A なら 0.0.0.0、AAAA なら :: を rr_ttl = 3600 で組み立てて返す。ほかの qtype は NOERROR / NODATA の応答へ落ちる。この分岐に来るのは、local_data_answer() が一致する local-data を見つけなかったときだけ"
manual:
  en: "doc/unbound.conf.rst always_null: Always returns 0.0.0.0 or ::0 for every name in the zone. Like redirect with zero data for A and AAAA. Ignores local data in the zone. Used for some block lists."
  ja: "doc/unbound.conf.rst always_null の項: Always returns 0.0.0.0 or ::0 for every name in the zone. Like redirect with zero data for A and AAAA. Ignores local data in the zone. Used for some block lists."
layers:
  en: ["answer generation per zone type"]
  ja: ["ゾーン型ごとの応答生成"]
status: verified
config: |
  local-zone: "ads.example.com." always_null
command: run-and-dig
expect:
  checkconf_exit: 0
  query: "www.ads.example.com. A"
  rcode: "NOERROR"
  answer_count: 1
  answer_contains: ["www.ads.example.com. 3600 IN A 0.0.0.0"]
  note:
    en: "Category documented: the result matches the manual. The manual does not give the TTL."
    ja: "分類 documented: man の記述どおり。TTL は man に書かれていない"

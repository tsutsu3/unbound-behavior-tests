id: local-zone-duplicate-keeps-later-block-local-data
title:
  en: "On a duplicate local-zone, the local-data written under the kept (last) line is also answered"
  ja: 重複した local-zone で、残った側（最後の行）の下に書いた local-data も引ける
chapter: "5.6"
category: A
versions: ["1.26.0"]
source:
  en: "services/localzone.c lz_enter_data() walks every cfg->local_data entry after all zones are entered, and lz_enter_rr_str() looks up the covering zone for each record, so both blocks' local-data land in the single example.com. zone"
  ja: "services/localzone.c lz_enter_data() はゾーンをすべて入れた後に cfg->local_data を全部たどり、lz_enter_rr_str() が1件ずつ覆うゾーンを探すので、両方の記述ブロックの local-data が1つの example.com. ゾーンに入る"
manual:
  en: "none (the man page says nothing about duplicate local-zone)"
  ja: "none（重複 local-zone に関する記述が man にない）"
layers:
  en: ["duplicate handling at zone registration", "covering zone lookup for local-data"]
  ja: ["ゾーン登録時の重複処理", "local-data の被覆ゾーン検索"]
status: verified
config: |
  local-zone: "example.com." static
  local-data: "one.example.com. A 192.0.2.1"
  local-zone: "example.com." static
  local-data: "two.example.com. A 192.0.2.2"
command: run-and-dig
expect:
  checkconf_exit: 0
  query: "two.example.com. A"
  rcode: "NOERROR"
  answer_contains: ["192.0.2.2"]
  note:
    en: "Pairs with local-zone-duplicate-keeps-both-local-data, which queries one.example.com."
    ja: "one.example.com. を問い合わせる local-zone-duplicate-keeps-both-local-data と対になる"

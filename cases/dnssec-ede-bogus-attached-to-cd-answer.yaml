id: dnssec-ede-bogus-attached-to-cd-answer
title:
  en: "With ede: yes, a bogus answer returned for a CD query also carries EDE 6"
  ja: "ede: yes では、CD の問い合わせに返す bogus の答えにも EDE 6 が付く"
chapter: "8.5"
category: A
versions:
- "1.26.0"
source:
  en: "services/mesh.c mesh_send_reply() -> mesh_find_and_attach_ede_and_reason(): with ede: yes, the EDE code recorded with the bogus reason is attached, and with val-log-level 2 the reason_bogus_str as its text. The same is done when the bogus answer is returned for a CD query"
  ja: "services/mesh.c mesh_send_reply() → mesh_find_and_attach_ede_and_reason(): ede: yes なら、bogus の理由とともに記録した EDE コードを付け、val-log-level 2 なら reason_bogus_str を説明文にする。CD の問い合わせに bogus の答えを返すときも同じ"
manual:
  en: "none (the ede entry does not say that an answer returned because of the CD bit carries the EDE too)"
  ja: "none（ede の項は、CD ビットのために返した答えにも EDE が付くことを書いていない）"
layers:
  en:
  - "validation"
  - "Extended DNS Errors"
  ja:
  - "検証"
  - "Extended DNS Errors"
status: verified
config: |
  trust-anchor: "signed.example. DS 51548 13 2 338518751d573ad799ca16bbc79f428dcbc5e4cf8ffb6a253cf088482f057b32"
  ede: yes
  stub-zone:
    name: "signed.example."
    stub-addr: 127.0.0.1@5810
command: run-with-upstreams
expect:
  checkconf_exit: 0
  upstreams:
  - addr: "127.0.0.1:5810"
    replies:
    - qname: "signed.example."
      qtype: DNSKEY
      aa: true
      answer:
      - "signed.example. 300 IN DNSKEY 257 3 13 /KqfUo9VrjZWU0aj9EC7KIUgL2SyGAgt 2jD+wX0dwXELX8XnB4YoRriV7nrUQH/Q QE8s/RTdWA2qt8E7fThZgA=="
      - "signed.example. 300 IN RRSIG DNSKEY 13 2 300 20460901000000 20260901000000 51548 signed.example. O/yTTEPP6UEM9Ba/KofSx6oHThyjBvrd XgFz0K6/dpp5TiSgjPky+BUaLkN4dVQw PVKK8hVT+mW5DZZvMn1pFw=="
    - qname: "bad.signed.example."
      qtype: A
      aa: true
      answer:
      - "bad.signed.example. 300 IN A 192.0.2.99"
      - "bad.signed.example. 300 IN RRSIG A 13 3 300 20460901000000 20260901000000 51548 signed.example. fQDZqd6obmGaCQnf8re2XKol6tOFCN4v WfDk2vBy1wMVpq30BpCnHWiWnN/d23CN M1wY6G+vl6o+e6XV3E10Ug=="
  query: "bad.signed.example. A"
  query_flags:
  - cd
  - do
  rcode: "NOERROR"
  answer_contains:
  - "bad.signed.example. 60 IN A 192.0.2.99"
  ede_code: 6
  note:
    en: "So a client that validates for itself is told which answers Unbound considers bogus"
    ja: "自分で検証するクライアントにも、Unbound がどの答えを bogus と見たかが伝わる"

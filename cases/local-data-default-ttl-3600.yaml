id: local-data-default-ttl-3600
title:
  en: "Omitting the local-data TTL gives 3600"
  ja: local-data の TTL を省略すると 3600 になる
chapter: "5.5"
category: A
versions: ["1.26.0"]
source:
  en: "services/localzone.c rrstr_get_rr_content() and get_rr_nameclass() pass the default TTL as a literal: sldns_str2wire_rr_buf(..., 3600, ...). It cannot be changed from the configuration"
  ja: "services/localzone.c rrstr_get_rr_content() および get_rr_nameclass() が sldns_str2wire_rr_buf(..., 3600, ...) と既定 TTL をリテラルで渡す。設定項目からは変更できない"
manual:
  en: "none (the local-data entry in `unbound.conf.5.in` does not give the default TTL; searched for 'local-data', 'ttl' and 'default')"
  ja: "none（`unbound.conf.5.in` の local-data の項に TTL 省略時の既定値の記述がない。'local-data' 'ttl' 'default' で検索）"
layers:
  en: ["local-data RR string parsing"]
  ja: ["local-data の RR 文字列パース"]
status: verified
config: |
  local-zone: "example.com." static
  local-data: "example.com. A 192.0.2.1"
command: run-and-dig
expect:
  checkconf_exit: 0
  query: "example.com. A"
  rcode: "NOERROR"
  answer_ttl: 3600
  answer_contains: ["192.0.2.1"]
  note:
    en: "Settings such as cache-min-ttl do not change it. It is a literal in the source"
    ja: "cache-min-ttl などの設定では変えられない。ソース上のリテラル"

id: dnssec-secure-answer-no-ad-without-do-or-ad
title:
  en: "A secure answer has no AD bit when the query has neither the DO bit nor the AD bit"
  ja: "問い合わせに DO ビットも AD ビットもなければ、secure の応答でも AD ビットは付かない"
chapter: "8.3"
category: A
versions:
- "1.26.0"
source:
  en: "util/data/msgencode.c reply_info_answer_encode(): BIT_AD is set only when the reply is secure and the query had the DO bit or the AD bit (secure && (dnssec || (qflags&BIT_AD)))"
  ja: "util/data/msgencode.c reply_info_answer_encode(): 応答が secure で、問い合わせに DO ビットか AD ビットがあるときだけ BIT_AD を立てる（secure && (dnssec || (qflags&BIT_AD))）"
manual:
  en: "none (unbound.conf does not say when the AD bit is set in a reply)"
  ja: "none（unbound.conf は応答に AD ビットを立てる条件を書いていない）"
layers:
  en:
  - "validation"
  - "reply flags"
  ja:
  - "検証"
  - "応答のフラグ"
status: verified
config: |
  trust-anchor: "signed.example. DS 51548 13 2 338518751d573ad799ca16bbc79f428dcbc5e4cf8ffb6a253cf088482f057b32"
  stub-zone:
    name: "signed.example."
    stub-addr: 127.0.0.1@5803
command: run-with-upstreams
expect:
  checkconf_exit: 0
  upstreams:
  - addr: "127.0.0.1:5803"
    replies:
    - qname: "signed.example."
      qtype: DNSKEY
      aa: true
      answer:
      - "signed.example. 300 IN DNSKEY 257 3 13 /KqfUo9VrjZWU0aj9EC7KIUgL2SyGAgt 2jD+wX0dwXELX8XnB4YoRriV7nrUQH/Q QE8s/RTdWA2qt8E7fThZgA=="
      - "signed.example. 300 IN RRSIG DNSKEY 13 2 300 20460901000000 20260901000000 51548 signed.example. O/yTTEPP6UEM9Ba/KofSx6oHThyjBvrd XgFz0K6/dpp5TiSgjPky+BUaLkN4dVQw PVKK8hVT+mW5DZZvMn1pFw=="
    - qname: "www.signed.example."
      qtype: A
      aa: true
      answer:
      - "www.signed.example. 300 IN A 192.0.2.80"
      - "www.signed.example. 300 IN RRSIG A 13 3 300 20460901000000 20260901000000 51548 signed.example. DxKXzctz36wDkmandl0ieplyQfYDGrxs TxQ/Ame/oA/3Yj5ogwCx7s3ajK3G/eQ6 ZX05grsK3sVufhVqwiQIhw=="
    received_contains:
    - "signed.example. DNSKEY"
  query: "www.signed.example. A"
  query_flags: []
  rcode: "NOERROR"
  answer_count: 1
  flags_not_contains:
  - ad
  note:
    en: "The answer is validated all the same (the DNSKEY is fetched); only the flag is withheld. So the absence of ad does not show that validation is off"
    ja: "検証そのものは行われる（DNSKEY を取りに行く）。立てないのはフラグだけ。ad がないことは、検証が働いていないことを示さない"

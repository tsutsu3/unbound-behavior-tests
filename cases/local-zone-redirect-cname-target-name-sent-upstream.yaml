id: local-zone-redirect-cname-target-name-sent-upstream
title:
  en: "The query Unbound sends upstream for a redirect zone's CNAME is for the target name"
  ja: redirect ゾーンの CNAME で Unbound が上流へ送る問い合わせは、ターゲットの名前についてのもの
chapter: "5.4"
category: C
versions: ["1.26.0"]
source:
  en: "daemon/worker.c worker_handle_request() replaces the qname with the alias target via local_alias_shallow_copy_qname() before the mesh. iterator/iterator.c processQueryTargets() logs sending query: <qname> <type> <class> at verbosity 3 for each query it sends"
  ja: "daemon/worker.c worker_handle_request() は mesh の前に local_alias_shallow_copy_qname() で qname をターゲットに差し替える。iterator/iterator.c processQueryTargets() は送る問い合わせごとに verbosity 3 で sending query: <名前> <型> <クラス> を出す"
manual:
  en: "doc/unbound.conf.5.in, redirect entry: The resolution proceeds with upstream DNS resolution, and that does not include the lookup in local zones."
  ja: "doc/unbound.conf.5.in redirect の項: The resolution proceeds with upstream DNS resolution, and that does not include the lookup in local zones."
layers:
  en: ["local alias for the CNAME", "resolution of the alias target"]
  ja: ["CNAME の local alias 化", "alias ターゲットの解決"]
status: verified
config: |
  verbosity: 3
  interface: 127.0.0.1@5522
  local-zone: "example.com." redirect
  local-data: "example.com. CNAME www.example.net."
  local-zone: "example.net." static
  local-data: "www.example.net. A 192.0.2.9"
  forward-zone:
    name: "."
    forward-addr: 127.0.0.1@5522
command: run-and-dig
expect:
  checkconf_exit: 0
  query: "example.com. A"
  rcode: "NOERROR"
  stderr_contains: "sending query: www.example.net. A IN"
  note:
    en: "Same zones as local-zone-redirect-cname-target-skips-local-zones, with the name of the outgoing query read from the log. The upstream is this same Unbound on a second interface so that the query is answered"
    ja: "local-zone-redirect-cname-target-skips-local-zones と同じゾーンで、外へ出た問い合わせの名前をログで読む。問い合わせに応答が返るよう、上流は2つ目の待ち受けの同じ Unbound にした"
